services:
  postgres:
    image: postgres:16-alpine
    container_name: infrapulse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: infrapulse
      POSTGRES_PASSWORD: infrapulse_dev
      POSTGRES_DB: infrapulse
    volumes:
      - infrapulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrapulse -d infrapulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  infrapulse_pg_data:
